# Run the test suite on every pull request, and on pushes to master.
#
# Why this exists: this repository had no CI at all, so the only thing standing
# between a regression and the Chrome Web Store was remembering to run the
# tests locally. Two blank-tab bugs shipped that way — the Compare tab throwing
# a ReferenceError on a deleted identifier, and a stray brace surviving a
# merge. Both were caught by tests that existed; nothing ran them.
#
# The suite is split into two jobs on purpose. The unit tests finish in seconds
# and catch most breakage, so they must not sit behind the browser tests, which
# drive a real Chromium with the unpacked extension loaded and take minutes.
name: tests

# A bare `push:` alongside `pull_request:` runs EVERY job twice on a branch
# that has a PR open — once for the branch ref, once for the merge ref. The
# first run of this workflow did exactly that: eight check runs for four jobs,
# with the browser suite (~7 minutes) paid for twice. Pushes are therefore
# limited to the default branch, where there is no PR run to duplicate; branch
# work is covered by the pull_request trigger.
on:
  push:
    branches: [master]
  pull_request:

# A new push makes an in-flight run pointless. Keyed on head_ref (the branch)
# with a fallback to ref, so the push-run and PR-run of the same branch land in
# ONE group rather than two — github.ref alone differs between them
# (refs/heads/x vs refs/pull/N/merge) and so would never cancel each other.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax (ESM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `node --check` alone is not enough here: it parses as CommonJS, so it
      # passes on a file containing merge-conflict markers and on ESM-only
      # syntax errors. --input-type=module is what actually validates these
      # files, and this is a real lesson from a broken merge that shipped.
      - name: Parse every source file as an ES module
        run: |
          fail=0
          while IFS= read -r f; do
            if ! node --input-type=module --check < "$f" 2>/tmp/err; then
              echo "::error file=$f::$(head -3 /tmp/err | tr '\n' ' ')"
              fail=1
            fi
          done < <(find src ui test -name '*.js' -o -name '*.mjs' | sort)
          exit $fail

      # The built-in AI's runtime ships inside the extension (0.70.0): its
      # files must be exactly the vendored versions, and must not build code
      # from strings.
      - name: Check the vendored AI runtime
        run: node scripts/vendor-transformers.mjs --check

      # The Firefox build (0.72.0): Mozilla's own linter on dist/firefox.
      # Warnings (Chrome-only calls behind checks, the vendored runtime) are
      # expected; errors fail the job.
      - name: Build and lint the Firefox version
        run: |
          node scripts/build-firefox.mjs
          npx -y web-ext@8 lint --source-dir dist/firefox --self-hosted

      # A manifest that Chrome or the Web Store rejects is a shipping failure
      # the test suite never sees. The description limit is checked because a
      # submission was rejected for exactly that (146 chars against a 132 cap).
      - name: Validate manifest.json
        run: |
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const m = JSON.parse(readFileSync("manifest.json", "utf8"));
            const problems = [];
            const cap = (field, value, limit) => {
              if (typeof value === "string" && value.length > limit) {
                problems.push(`${field} is ${value.length} chars, over the ${limit} limit`);
              }
            };
            cap("description", m.description, 132);
            // 0.71.0: the name and description come from _locales; each
            // description in every language has the same cap.
            for (const d of (m.default_locale ? readdirSync("_locales") : [])) {
              const msgs = JSON.parse(readFileSync(`_locales/${d}/messages.json`, "utf8"));
              cap(`_locales/${d} appDesc`, msgs.appDesc && msgs.appDesc.message, 132);
              cap(`_locales/${d} appName`, msgs.appName && msgs.appName.message, 45);
            }
            cap("name", m.name, 45);
            cap("action.default_title", m.action?.default_title, 75);
            if (m.manifest_version !== 3) problems.push("manifest_version must be 3");
            if (!m.version) problems.push("version is missing");
            for (const f of [m.background?.service_worker, m.action?.default_popup]) {
              if (f) {
                try { readFileSync(f); } catch { problems.push(`${f} is referenced but missing`); }
              }
            }
            for (const cs of m.content_scripts || []) {
              for (const js of cs.js || []) {
                try { readFileSync(js); } catch { problems.push(`${js} is referenced but missing`); }
              }
            }
            if (problems.length) {
              for (const p of problems) console.log(`::error::${p}`);
              process.exit(1);
            }
            console.log("manifest.json looks shippable");
          '

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Tests that need no browser. Each file prints "ALL PASSED" and exits
      # non-zero on failure, so the exit code is the gate.
      - name: Run unit tests
        run: |
          fail=0
          for f in test/about-view.test.mjs test/adapter.test.mjs test/ai-brands.test.mjs test/analyze-view.test.mjs test/auth-check.test.mjs \
                   test/brand-context.test.mjs test/build-id.test.mjs test/chatgpt-retrieval.test.mjs test/compare-view.test.mjs test/over-time-view.test.mjs test/history-view.test.mjs \
                   test/auto-competitors.test.mjs \
                   test/behaviour.test.mjs test/brands.test.mjs test/campaign-board.test.mjs test/campaign-xlsx.test.mjs test/pdf-report.test.mjs \
                   test/concurrency.test.mjs test/diagnostics-summary.test.mjs \
                   test/dom-harvest-multiturn.test.mjs test/engine-submit-signal.test.mjs test/errorlog.test.mjs \
                   test/fanout.test.mjs test/feedback-bundle.test.mjs \
                   test/gemini-answer.test.mjs test/gemini-channel.test.mjs test/geo.test.mjs \
                   test/grok-gateway.test.mjs test/grok-render-citation-tags.test.mjs \
                   test/interception-endpoints.test.mjs test/dom-harvest.test.mjs test/nano-stance.test.mjs \
                   test/onboarding.test.mjs \
                   test/perplexity-citation-footnote-brands.test.mjs test/perplexity-citation-marking.test.mjs \
                   test/perplexity-cite-marker-brands.test.mjs test/perplexity-clock-contamination.test.mjs \
                   test/perplexity-export.test.mjs test/perplexity-fanout.test.mjs \
                   test/perplexity-fanout-answer-leak.test.mjs \
                   test/perplexity-block-stream.test.mjs \
                   test/perplexity-markdown-harvest.test.mjs test/perplexity-real-dom.test.mjs \
                   test/perplexity-steps.test.mjs test/perplexity-table-layout-brands.test.mjs \
                   test/perplexity-ws-contamination.test.mjs \
                   test/glossary.test.mjs test/grounding-score.test.mjs test/multi-engine.test.mjs \
                   test/pacing.test.mjs test/retention.test.mjs \
                   test/image-url.test.mjs test/sources.test.mjs test/text-sanitize.test.mjs test/xlsxlite.test.mjs \
                   test/brands-local.test.mjs test/same-answer.test.mjs test/gemini-hotels.test.mjs \
                   test/chatgpt-ads.test.mjs test/chatgpt-genui.test.mjs test/raw-breakdown.test.mjs test/page-text.test.mjs test/offers.test.mjs test/netlog.test.mjs test/proto-strings.test.mjs test/answer-links.test.mjs test/campaign-view.test.mjs test/display.test.mjs test/chatgpt-signed-out.test.mjs test/money.test.mjs test/site-kind.test.mjs test/text-has.test.mjs test/ai-check.test.mjs test/hardware-tier.test.mjs test/i18n.test.mjs test/firefox-build.test.mjs test/assistant.test.mjs test/capture-health.test.mjs; do
            echo "── $f"
            if ! node "$f"; then
              echo "::error file=$f::unit test failed"
              fail=1
            fi
          done
          exit $fail

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    # Generous: full-audit alone drives every tab, filter, export and drilldown
    # in a real Chromium, and the extension's own capture pipeline runs on
    # multi-megabyte fixtures.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Chromium only — the extension is Chrome-targeted, so the other engines
      # would be download time for no coverage.
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      # An extension cannot be loaded in true headless mode, so these tests use
      # --headless=new inside a persistent context. Xvfb is not needed for
      # --headless=new, but the runner has no display, so keep the flag path the
      # tests already use rather than changing how they launch.
      - name: Run browser tests
        run: |
          fail=0
          for f in test/about.test.mjs test/app-header.test.mjs test/analyze-feedback.test.mjs test/analyze-header-gap.test.mjs test/analyze-popup.test.mjs \
                   test/analyze-layout.test.mjs test/analyze-tab.test.mjs test/brand-detail.test.mjs test/build-mismatch.test.mjs \
                   test/campaign-diagnostics-export.test.mjs test/capture-attribution.test.mjs \
                   test/campaign-board-ui.test.mjs test/campaign-drilldown.test.mjs test/campaign-run-ui.test.mjs test/campaign-setup.test.mjs test/capture-latency.test.mjs \
                   test/compare-tab.test.mjs test/concurrency-live.test.mjs test/dashboard.test.mjs test/duplicate-capture.test.mjs test/export-dialog.test.mjs test/pdf-report-ui.test.mjs \
                   test/full-audit.test.mjs test/long-answer.test.mjs \
                   test/funnel-omitted.test.mjs test/grok-navigation-timeout.test.mjs test/live-run-toast.test.mjs test/loader-status-stability.test.mjs \
                   test/mention-list.test.mjs \
                   test/perplexity-campaign-preview.test.mjs test/prompt-manual-add.test.mjs \
                   test/prompt-submit.test.mjs test/redirect-claim.test.mjs test/reload-false-positive.test.mjs \
                   test/run-interrupted.test.mjs \
                   test/saved-conversations-engine.test.mjs test/source-pipeline-ui.test.mjs test/tab-management.test.mjs \
                   test/timeout-diagnostics.test.mjs \
                   test/ui-visibility.test.mjs test/same-answer-store.test.mjs test/answer-extras-ui.test.mjs \
                   test/theme-style.test.mjs test/genui-answer-ui.test.mjs test/cited-pages.test.mjs test/network-recorder.test.mjs test/page-copy.test.mjs test/campaign-view-ui.test.mjs test/display-settings.test.mjs test/gemini-channel-ui.test.mjs test/capture-pause.test.mjs test/builtin-ai.test.mjs test/i18n-ui.test.mjs test/screens-ui.test.mjs test/ask-ui.test.mjs test/capture-real-page.test.mjs; do
            echo "── $f"
            if ! node "$f"; then
              echo "::error file=$f::browser test failed"
              fail=1
            fi
          done
          exit $fail

  # Guards against a test file being added and silently never run: the lists
  # above are hand-maintained, and a test nobody runs is the exact hole that
  # let the Compare-tab regression ship.
  coverage-of-suite:
    name: every test file is wired into CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no test file is missing from the job lists
        run: |
          missing=0
          for f in test/*.test.mjs; do
            if ! grep -q "$(basename "$f")" .github/workflows/tests.yml; then
              echo "::error file=$f::not listed in .github/workflows/tests.yml — add it to the unit or browser job"
              missing=1
            fi
          done
          exit $missing
